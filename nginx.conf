events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------
    # Define upstreams (same container, different ports)
    # -------------------------------
    upstream homepage {
        server dashboard:8050;
    }
    upstream flooding-dashboard {
        server dashboard:8060;
    }
    upstream uhi-rf-dashboard {
        server dashboard:8061;
    }
    upstream ficlima-dashboard {
        server dashboard:8062;
    }
    upstream infiltration-dashboard {
        server dashboard:8063;
    }
	upstream uhi-svc-dashboard {
        server dashboard:8064;
    }

    # -------------------------------
    # Main server block
    # -------------------------------
    server {
        listen 80;
        server_name vie-ai-dev.urbreath.tech;

        # Security headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # -------------------------------
        # Routes mapped to internal ports
        # -------------------------------
        location / {
            proxy_pass http://homepage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_http_version 1.1;
		    proxy_read_timeout 300s;
        }

        location /flooding/ {
            proxy_pass http://flooding-dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header Upgrade $http_upgrade;     
		    proxy_set_header Connection "upgrade";  
		    proxy_http_version 1.1;  
		    proxy_read_timeout 300s;   
        }

        location /uhi-rf/ {
            proxy_pass http://uhi-rf-dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_http_version 1.1;
		    proxy_read_timeout 300s;  
        }

        location /ficlima/ {
            proxy_pass http://ficlima-dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_http_version 1.1;
		    proxy_read_timeout 300s;
        }

        location /infiltration/ {
            proxy_pass http://infiltration-dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_http_version 1.1;
		    proxy_read_timeout 300s;
        }
		
		 location /uhi-svc-dashboard/ {
            proxy_pass http://uhi-svc-dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_http_version 1.1;
		    proxy_read_timeout 300s;
        }

        # Optional for static content
        location /static/ {
            alias /usr/share/nginx/html/;
            autoindex on;
        }
    }
}
